# Run by the pre-commit hook installed with `bash scripts/versionado.sh init`
# (after its own secret / large-file check). Manual run: pre-commit run --all-files
# Thesis files and data are frozen: never rewritten by the hooks.
exclude: ^(notebooks/tesis_v1/|reports/tesis_v1/|Data/|Parameters/|MANIFEST/|configs/frozen/)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: \.(csv|xlsx)$
      - id: trailing-whitespace
        exclude: \.(csv|xlsx)$
