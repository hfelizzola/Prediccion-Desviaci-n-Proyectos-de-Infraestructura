[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "secop-dev"
version = "1.1.0"
description = "Interpretable machine learning to predict time and cost deviations in Colombian public works contracts (SECOP)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Heriberto Felizzola" }]
# Pinned to the Google Colab environment used for the thesis results (v1.0.0).
dependencies = [
    "numpy==2.0.2",
    "pandas==2.2.2",
    "scipy==1.15.3",
    "scikit-learn==1.6.1",
    "imbalanced-learn==0.13.0",
    "xgboost==2.1.4",
    "optuna==4.3.0",
    "shap==0.47.2",
    "statsmodels==0.14.4",
    "matplotlib==3.10.0",
    "seaborn==0.13.2",
    "joblib==1.5.0",
    "openpyxl==3.1.5",
    "pyyaml==6.0.2",
]

[project.optional-dependencies]
extract = ["sodapy==2.2.0", "python-dotenv>=1.0"]
dev = ["pytest>=8.3", "ruff>=0.6", "pre-commit>=3.7", "nbstripout>=0.7"]

[project.scripts]
secop-dev = "secop_dev.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/secop_dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "regression: compares the pipeline with the thesis files (needs the data folders)",
]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["notebooks/tesis_v1"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
